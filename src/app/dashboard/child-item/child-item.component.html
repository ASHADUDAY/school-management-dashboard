<div class="child_shared_item" style="display: flex; align-items: center">
  <div *ngFor="let child of items; let i = index">
    <!-- Handle branch node menu items -->

    <div
      *ngIf="child.children && child.children.length > 0"
      [ngClass]="{ 'open-card': child.openCardFlag == true }"
      class="childElem"
      (click)="openCard($event, i)"
    >
      <div class="p--5">
        <span>{{
          lang == "spanish" ? child.displayEsName : child.displayName
        }}</span>
        <mat-icon class="right-icon">{{
          child.openCardFlag == true
            ? "remove_circle_outline"
            : "add_circle_outline"
        }}</mat-icon>
      </div>
      <app-child-item
        #menu
        [items]="child.children"
        [lang]="lang"
        class="childMenu2"
      ></app-child-item>
    </div>
    <!-- Handle leaf node menu items -->
    <div
      *ngIf="!child.children || child.children.length == 0"
      class="childElem p--5"
      (click)="emitSelected(i)"
    >
      <!-- [routerLink]="child.route" -->
      <button
        mat-button
        [ngClass]="{
          'selected-btn': selectedSubmenuIndex === i,
          'unSelected-btn': selectedSubmenuIndex !== i,
        }"
        class="menu-icon"
        style="
          width: 2vw;
          display: flex;
          align-items: center;
          justify-content: space-evenly;
        "
        matTooltip="{{ child?.label || 'no-label' }}"
        matTooltipPosition="above"
        matTooltipShowDelay="0"
      >
        <img
          [src]="'/assets/images/icon/' + child.icon + '.svg'"
          alt="icon"
          style="height: 25px; width: 25px; display: flex"
        />
      </button>
      >
      <!-- <div
        color="primary"
        [ngClass]="{
          'selected-btn': selectedSubmenuIndex === i,
          'unSelected-btn': selectedSubmenuIndex !== i,
        }"
        class="menu-icon"
        style="
          width: 2vw;
          display: flex;
          align-items: center;
          justify-content: space-evenly;
        "
        matTooltip="{{ child?.label ?? '' }}"
      >
        <img
          [src]="'/assets/images/icon/' + child.icon + '.svg'"
          alt="icon"
          style="height: 25px; width: 25px; display: flex"
        />
      </div> -->
    </div>
  </div>
</div>
